<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="todo-header">
        <h1>ToDo List</h1>
        <img src="/assets/images/clipboard-check-solid-full.svg" alt="" />
      </header>
      <div class="input-group">
        <input type="text" placeholder="Add your task" />
        <button>Add Task</button>
      </div>
      <p class="tasks-info">
        You have <span class="tasks-num">3</span> task(s) to complete
      </p>
      <div class="tasks-nav">
        <div class="tasks-categories">
          <p class="category selected">All</p>
          <p class="category">Pending</p>
          <p class="category">Completed</p>
        </div>
        <button>Clear All</button>
      </div>
      <ul class="todo-list">
        <li class="todo">
          <div class="todo__item">
            <input id="check-todo" type="checkbox" />
            <label for="check-todo">Edit Video</label>
          </div>
          <div class="todo__icons">
            <svg class="icon">
              <use xlink:href="/assets/images/icons.svg#pen-solid-full"></use>
            </svg>
            <svg class="icon">
              <use xlink:href="/assets/images/icons.svg#trash-solid-full"></use>
            </svg>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
