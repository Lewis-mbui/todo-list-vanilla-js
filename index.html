<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ToDo List</h1>
        <img src="/assets/images/clipboard-check-solid-full.svg" alt="" />
      </header>
      <div class="input-group">
        <input type="text" />
        <button>+</button>
      </div>
      <p>You have <span>3</span> task(s) to complete</p>
      <div>
        <div class="tasks-categories">
          <p>All</p>
          <p>Pending</p>
          <p>Completed</p>
        </div>
        <button>Clear All</button>
      </div>
      <ul class="todos-list">
        <li class="todo">
          <input type="checkbox" />
          <p>Edit Video</p>
          <img src="/assets/images/pen-solid-full.svg" alt="" />
          <img src="/assets/images/trash-solid-full.svg" alt="" />
        </li>
        <li class="todo">
          <input type="checkbox" />
          <p>Edit Video</p>
          <img src="/assets/images/pen-solid-full.svg" alt="" />
          <img src="/assets/images/trash-solid-full.svg" alt="" />
        </li>
        <li class="todo">
          <input type="checkbox" />
          <p>Edit Video</p>
          <img src="/assets/images/pen-solid-full.svg" alt="" />
          <img src="/assets/images/trash-solid-full.svg" alt="" />
        </li>
      </ul>
    </div>
  </body>
</html>
